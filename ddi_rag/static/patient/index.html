<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedTrust Connect — Check your medications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200..800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Design system adapted from an uploaded Dala/craftedbygc brand kit:
     void-black canvas, single violet accent (electric-iris), amber
     highlight (saffron-spark), PPNeueMontreal → Inter (the kit's own
     documented substitute), 6px-based spacing/radius scale. Deliberately
     NOT a literal port — the source kit is a marketing-landing-page
     system (no cards, one accent color total, ultra-light 200-weight
     body text, 78-113px display type). This is a dense clinical tool:
     panels are kept for scannability, body text stays at a readable
     weight, and the severity palette below (critical/major/caution/
     informational/unknown/safe) is a real addition the kit has no
     equivalent for — patient safety findings need color distinctions
     Dala's single-accent system was never designed to carry. */
  :root {
    --paper:        #000000;   /* void canvas — page background */
    --paper-raised: #0c0c0e;   /* panel surface — a hairline lift off pure black, not a "card" in Dala's literal sense but the minimum structure a findings list needs to stay scannable */
    --ink:          #ffffff;   /* bone-white — primary text */
    --ink-soft:     #9a9a9a;   /* ash-gray — secondary text */
    --ink-faint:    #6b6b70;   /* a dimmer step for the quietest captions */
    --primary:      #8052ff;   /* electric-iris — primary actions, links, focus */
    --primary-tint: #9c78ff;
    --accent:       #ffb829;   /* saffron-spark — highlight/emphasis, kept as its own role per the kit */
    --accent-tint:  #2e2210;   /* dark amber wash for chip backgrounds on black */
    --line:         rgba(255,255,255,0.12);
    --line-soft:    rgba(255,255,255,0.07);
    /* Severity — not in the source kit at all; a clinical safety app
       cannot collapse this to one accent color, so this extends the
       kit's "one saturated hue per semantic role" logic across the
       distinctions a findings list actually needs. */
    --critical:      #ff5c5c;
    --major:         #ff8a3d;
    --caution:       #ffb829;
    --informational: #6fc8ff;
    --unknown:       #b892ff;
    --safe:          #3ecf8e;
  }
  * { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  body { background: var(--paper); color: var(--ink); }

  /* The kit's actual type system, applied — not loaded and left unused.
     Headings stay weight 400 always (never bold; scale carries hierarchy,
     exactly as the kit specifies), with the real negative tracking value
     at each step. Prose gets the signature ultra-light 200 weight at 18px
     — this is Dala's most distinctive, most-substituted-away choice, so
     it's the one most worth actually keeping. Nav/labels/buttons get 600
     uppercase with the kit's real 0.35px / 0.025em tracking, not an
     arbitrary loose tracking value. */
  .font-display { font-weight: 400; letter-spacing: -0.04em; }
  .text-display    { font-weight: 400; font-size: 78px;  line-height: 1.1;  letter-spacing: -3.12px; }
  .text-heading    { font-weight: 400; font-size: 48px;  line-height: 1.1;  letter-spacing: -1.68px; }
  .text-heading-sm { font-weight: 400; font-size: 42px;  line-height: 1.2;  letter-spacing: -1.68px; }
  .text-subheading { font-weight: 400; font-size: 36px;  line-height: 1.2; }
  .text-heading-xs { font-weight: 400; font-size: 27px;  line-height: 1; }
  .text-heading-2xs{ font-weight: 400; font-size: 24px;  line-height: 1.25; letter-spacing: -0.48px; }
  .text-prose      { font-weight: 200; font-size: 18px;  line-height: 1.5; }
  .label-tag       { font-weight: 600; font-size: 14px;  letter-spacing: 0.35px; text-transform: uppercase; }
  /* Smaller sibling of .label-tag for form field labels and status pills —
     same uppercase/600 idiom, the kit's 12px "xs-2" caption-label step. */
  .field-label     { font-weight: 600; font-size: 12px;  letter-spacing: 0.25px; text-transform: uppercase; }
  /* The kit's plain --text-caption token (12px/400/1.5) — small supporting
     text that is NOT a label: captions, dates, helper sentences. */
  .text-caption    { font-weight: 400; font-size: 12px;  line-height: 1.5; }
  @media (max-width: 640px) {
    .text-display { font-size: 42px; letter-spacing: -1.68px; }
    .text-heading { font-size: 36px; letter-spacing: -1.2px; }
  }
  .card { background: var(--paper-raised); border: 1px solid var(--line); }
  .card-shadow { box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35); }
  .reveal { opacity: 0; transform: translateY(12px); animation: reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
  .pulse-dot { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .field { transition: border-color 0.15s ease, box-shadow 0.15s ease; background: var(--paper-raised); color: var(--ink); }
  .field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(128,82,255,0.20); }
  .field::placeholder { color: var(--ink-faint); }
  .btn-primary { background: var(--primary); transition: background 0.15s ease, transform 0.08s ease; }
  .btn-primary:hover { background: var(--primary-tint); }
  .btn-primary:active { transform: scale(0.985); }
  .btn-primary:disabled { background: #3a3550; color: #7a7690; cursor: not-allowed; }
  .btn-accent { background: var(--primary); transition: background 0.15s ease, transform 0.08s ease; }
  .btn-accent:hover { background: var(--primary-tint); }
  .btn-accent:active { transform: scale(0.985); }
  .btn-accent:disabled { background: #3a3550; color: #7a7690; cursor: not-allowed; }
  .chip { background: var(--accent-tint); color: var(--accent); border: 1px solid rgba(255,184,41,0.35); }
  /* Tag-list entries: the ENTIRE pill is the click target for removal, not
     just the small × glyph inside it — a tiny icon-only hit area reads as
     "I can't click this" even when it technically works. */
  .chip-remove { cursor: pointer; transition: background 0.12s ease, border-color 0.12s ease; }
  .chip-remove:hover { background: rgba(255,184,41,0.18); border-color: var(--accent); }
  .underline-link { text-underline-offset: 3px; text-decoration-color: var(--line); }
  .underline-link:hover { text-decoration-color: currentColor; }
  ::selection { background: rgba(128,82,255,0.35); }
  .scan-track { position: relative; overflow: hidden; }
  .scan-bar {
    position: absolute; top: 0; left: -30%; width: 30%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(128,82,255,0.45), transparent);
    animation: scan 1.6s ease-in-out infinite;
  }
  @keyframes scan { 0% { left: -30%; } 100% { left: 100%; } }
  .fade-in { animation: fadeIn 0.35s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .spinner { border: 2px solid rgba(128,82,255,0.20); border-top-color: var(--primary); border-radius: 999px; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  textarea.field { resize: vertical; }

  /* Hero constellation — Dala's signature visual: an animated field of tiny
     outlined triangles forming an organic cloud, the one piece of imagery
     the kit specifies at all ("no photography, no illustration — the
     particle field is the only hero visual"). Scoped to the Home hero only:
     it's a landing moment, not something that belongs on a form or a
     findings list. */
  .hero-visual { position: relative; }
  .hero-visual::before {
    content: '';
    position: absolute; inset: -20%;
    background: radial-gradient(circle at center, rgba(128,82,255,0.16), rgba(21,132,110,0.08) 45%, transparent 72%);
    filter: blur(8px);
    pointer-events: none;
  }
  #hero-canvas { position: relative; display: block; width: 100%; height: auto; aspect-ratio: 1; }
  @media (max-width: 1023px) {
    .hero-visual { max-width: 220px; margin: 0 auto; }
  }
</style>
</head>
<body class="min-h-screen">

<div id="app" class="min-h-screen"></div>

<script>
const API = window.location.origin;
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// The LLM-generated explanation text sometimes comes back with markdown
// (**bold**, blank-line paragraphs) even though nothing renders it — this
// turns that into real HTML instead of showing literal asterisks. Input is
// escaped first, so only the tags this function inserts itself are real.
function mdLite(raw) {
  const bolded = esc(raw).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const paras = bolded.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  if (paras.length > 1) return paras.map(p => `<p class="mb-2.5 last:mb-0">${p.replace(/\n/g, '<br/>')}</p>`).join('');
  return bolded.replace(/\n/g, '<br/>');
}

function token() { return sessionStorage.getItem('medtrust_token'); }
function setToken(t) { t ? sessionStorage.setItem('medtrust_token', t) : sessionStorage.removeItem('medtrust_token'); }
function setUser(u) { sessionStorage.setItem('medtrust_user', JSON.stringify(u)); }
function getUser() { try { return JSON.parse(sessionStorage.getItem('medtrust_user')); } catch { return null; } }

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token()) headers['Authorization'] = `Bearer ${token()}`;
  const res = await fetch(`${API}${path}`, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

// ── Shared shell / nav ───────────────────────────────────────────────────────

function shell(active, bodyHtml, { tight = false } = {}) {
  const user = getUser();
  app.innerHTML = `
    <div class="min-h-screen flex flex-col">
      <header class="border-b" style="border-color: var(--line); background: var(--paper);">
        <div class="max-w-3xl mx-auto px-6 py-5 flex items-center justify-between">
          <button data-nav="home" class="flex items-center gap-2.5 group">
            <span class="w-2 h-2 rounded-full flex-shrink-0" style="background: var(--primary);"></span>
            <span class="text-[15px]" style="color: var(--ink); font-weight: 400; letter-spacing: -0.02em;">MedTrust Connect</span>
          </button>
          <nav class="flex items-center gap-1 label-tag">
            <button data-nav="check" class="px-4 py-2 rounded-full transition-colors" style="${active==='check' ? `background: var(--primary); color: #fff;` : `color: var(--ink-soft);`}">Quick check</button>
            ${user ? `
              <button data-nav="dashboard" class="px-4 py-2 rounded-full transition-colors" style="${active==='dashboard' ? `background: var(--primary); color: #fff;` : `color: var(--ink-soft);`}">My prescriptions</button>
              <button data-nav="signout" class="ml-2 px-4 py-2 rounded-full border" style="border-color: var(--line); color: var(--ink-soft);">Sign out</button>
            ` : `
              <button data-nav="signin" class="ml-2 px-5 py-2 rounded-full" style="background: var(--primary); color: #fff;">Sign in</button>
            `}
          </nav>
        </div>
      </header>
      <main class="flex-1 w-full ${tight ? 'max-w-3xl' : 'max-w-3xl'} mx-auto px-6 py-10">${bodyHtml}</main>
      <footer class="border-t py-6" style="border-color: var(--line);">
        <p class="max-w-3xl mx-auto px-6 text-[11.5px] leading-relaxed" style="color: var(--ink-faint);">
          MedTrust Connect is a support tool, not a diagnosis. Quick-check results are informational only,
          generated from FDA label data and a deterministic rule engine — they have <strong>not</strong> been
          reviewed by a licensed pharmacist. Always follow your care team's direction, and call emergency
          services for anything urgent.
        </p>
      </footer>
    </div>
  `;
  $('header').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-nav]');
    if (!btn) return;
    const target = btn.dataset.nav;
    if (target === 'home') renderHome();
    else if (target === 'check') renderChecker();
    else if (target === 'dashboard') renderDashboard();
    else if (target === 'signin') renderAuth();
    else if (target === 'signout') { setToken(null); setUser(null); renderHome(); }
  });
}

// ── Hero constellation ───────────────────────────────────────────────────────
// Dala's signature visual: a dense, organic cloud of tiny outlined triangles
// drifting slowly on black, in a full chromatic spectrum rather than the
// single brand accent. Plain Canvas 2D — no library needed for this. Scoped
// entirely to the Home screen: it's a landing moment, not a decoration to
// scatter across a form or a findings list.
//
// Each call owns its own rAF loop and stops itself the moment its canvas
// leaves the DOM (checked every frame), since this is an SPA that swaps
// #app.innerHTML wholesale on navigation — nothing else here would ever
// know when to clean up.
function initHeroConstellation(canvas) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Full-spectrum palette per the kit's own description of this component
  // ("a full spectrum of vivid colors"), weighted toward the three brand
  // hues but genuinely spanning warm-to-cool rather than staying on-brand.
  const palette = [
    '#8052ff', '#8052ff', '#9c78ff',   // electric-iris (brand, weighted)
    '#ffb829', '#ffb829',              // saffron-spark (brand, weighted)
    '#15846e', '#3ecf8e',              // deep-verdant + a lighter green
    '#ff5c7a', '#ff8a3d', '#6fc8ff', '#b892ff', '#ffffff'
  ];

  let particles = [];
  let w = 0, h = 0, dpr = 1;
  let raf = null;
  let start = performance.now();

  // Organic, non-circular silhouette: radius at each angle is the base
  // radius modulated by a few summed sine harmonics, so the cloud reads as
  // a blob/brain shape instead of a perfect disc.
  function shapeRadius(angle) {
    return 1
      + 0.16 * Math.sin(angle * 3 + 1.3)
      + 0.10 * Math.sin(angle * 5 - 0.7)
      + 0.07 * Math.sin(angle * 8 + 2.1);
  }

  function seed() {
    particles = [];
    const dense = 900;
    const ambient = 260;
    for (let i = 0; i < dense; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = (0.15 + 0.85 * Math.pow(Math.random(), 0.55)) * shapeRadius(angle);
      particles.push({
        angle, baseR: r,
        size: 1 + Math.random() * 2.4,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.4,
        phase: Math.random() * Math.PI * 2,
        speed: 0.15 + Math.random() * 0.25,
        drift: 0.015 + Math.random() * 0.02,
        color: palette[(Math.random() * palette.length) | 0],
        alpha: 0.55 + Math.random() * 0.45
      });
    }
    // Sparse outer field — fewer, dimmer, further out. Matches the kit's
    // separate "ambient particle field" as loose scatter beyond the core.
    for (let i = 0; i < ambient; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = (1.05 + Math.random() * 0.9) * shapeRadius(angle);
      particles.push({
        angle, baseR: r,
        size: 0.8 + Math.random() * 1.6,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: 0.08 + Math.random() * 0.15,
        drift: 0.01 + Math.random() * 0.015,
        color: palette[(Math.random() * palette.length) | 0],
        alpha: 0.12 + Math.random() * 0.22
      });
    }
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = rect.width; h = rect.height;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawTriangle(cx, cy, size, rot, color, alpha) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = (Math.PI * 2 / 3) * i - Math.PI / 2;
      const x = Math.cos(a) * size, y = Math.sin(a) * size;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  function frame(now) {
    if (!document.body.contains(canvas)) { raf = null; return; }
    const t = (now - start) / 1000;
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    const maxR = Math.min(w, h) / 2;
    for (const p of particles) {
      const wobble = Math.sin(t * p.speed + p.phase) * p.drift;
      const r = (p.baseR + wobble) * maxR;
      const a = p.angle + t * 0.02 * (p.baseR < 1 ? 1 : 0.4);
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r * 0.92; // slight vertical compression, brain-like rather than a perfect sphere
      const rot = p.rot + t * p.rotSpeed;
      drawTriangle(x, y, p.size, rot, p.color, p.alpha);
    }
    raf = requestAnimationFrame(frame);
  }

  seed();
  resize();
  if (reduceMotion) {
    frame(start); // one static frame, no loop — respects prefers-reduced-motion
  } else {
    raf = requestAnimationFrame(frame);
  }

  const onResize = () => {
    if (!document.body.contains(canvas)) { window.removeEventListener('resize', onResize); return; }
    resize();
  };
  window.addEventListener('resize', onResize, { passive: true });
}

// ── Home / landing ───────────────────────────────────────────────────────────

function renderHome() {
  const user = getUser();
  shell('home', `
    <div class="reveal grid lg:grid-cols-[1fr_260px] gap-10 lg:gap-14 items-center mb-16">
      <div>
        <p class="label-tag mb-5" style="color: var(--accent);">Medication safety, in plain language</p>
        <h1 class="font-display text-display mb-6" style="color: var(--ink);">
          Know what's in<br/>your medicine cabinet.
        </h1>
        <p class="text-prose max-w-lg mb-10" style="color: var(--ink-soft);">
          Type in what you're taking — no account needed — and see what our FDA-grounded
          interaction checker finds. If you already have prescriptions on file with a
          care team, sign in to see what your pharmacist has reviewed.
        </p>
        <div class="flex flex-wrap gap-3">
          <button id="cta-check" class="label-tag text-white px-6 py-3.5 rounded-full" style="background: var(--primary);">Check my medications →</button>
          ${user
            ? `<button data-nav="dashboard" class="label-tag px-6 py-3.5 rounded-full" style="color: var(--ink-soft);">Go to my prescriptions</button>`
            : `<button data-nav="signin" class="label-tag px-6 py-3.5 rounded-full" style="color: var(--ink-soft);">Sign in instead</button>`}
        </div>
      </div>
      <div class="hero-visual">
        <canvas id="hero-canvas" aria-hidden="true"></canvas>
      </div>
    </div>

    <div class="reveal">
      <div class="grid sm:grid-cols-3 gap-x-8 gap-y-10">
        <div>
          <p class="font-display text-heading-2xs mb-3" style="color: var(--primary);">01</p>
          <p class="label-tag mb-2" style="color: var(--ink);">No sign-up required</p>
          <p class="text-[14px] leading-relaxed" style="color: var(--ink-soft); font-weight: 300;">Type your medications and go — nothing is saved to an account, so nothing about you has to be.</p>
        </div>
        <div>
          <p class="font-display text-heading-2xs mb-3" style="color: var(--primary);">02</p>
          <p class="label-tag mb-2" style="color: var(--ink);">You bring the history</p>
          <p class="text-[14px] leading-relaxed" style="color: var(--ink-soft); font-weight: 300;">Since nothing's stored between visits, just type any allergies or past reactions in each time — takes a few seconds.</p>
        </div>
        <div>
          <p class="font-display text-heading-2xs mb-3" style="color: var(--primary);">03</p>
          <p class="label-tag mb-2" style="color: var(--ink);">Honest about limits</p>
          <p class="text-[14px] leading-relaxed" style="color: var(--ink-soft); font-weight: 300;">Unreviewed findings are always labeled as such — we never call something safe just because we don't know.</p>
        </div>
      </div>
    </div>
  `);
  $('#cta-check').addEventListener('click', renderChecker);
  initHeroConstellation($('#hero-canvas'));
}

// ── Guest self-checker ────────────────────────────────────────────────────────

// "checking" (the new drug/prescription) and "current" (what they already
// take) are kept as separate lists purely for how the form and results are
// framed — both get combined into one list for /api/self-check, since the
// rule engine checks every pair regardless of which side of the form a
// name came from. Splitting them is what lets the results read as "your
// new drug X may interact with your current Y" instead of one flat list.
const _draft = { checking: [], current: [], allergies: [], notes: '' };

function tagInputHtml(id, label, placeholder, items) {
  return `
    <div>
      <label class="field-label block mb-2" style="color: var(--ink-soft);">${label}</label>
      <div class="flex gap-2 mb-2">
        <input id="${id}-input" type="text" autocomplete="off" placeholder="${placeholder}" class="field flex-1 border rounded-lg px-3.5 py-2.5 text-[13.5px]" style="border-color: var(--line);" />
        <button id="${id}-add" type="button" class="px-4 rounded-lg border text-[13px] font-semibold" style="border-color: var(--line); color: var(--primary);">Add</button>
      </div>
      <div id="${id}-chips" class="flex flex-wrap gap-2 min-h-[2px]">
        ${items.map((v, i) => `<button type="button" data-remove="${i}" title="Remove ${esc(v)}" aria-label="Remove ${esc(v)}" class="chip chip-remove inline-flex items-center gap-1.5 text-[12.5px] font-medium pl-3 pr-2.5 py-1 rounded-full">${esc(v)}<span class="text-[15px] leading-none" aria-hidden="true">×</span></button>`).join('')}
      </div>
    </div>
  `;
}

// The backend caps the *combined* medications list at 8 (MAX_SELF_CHECK_ITEMS
// in config.py) regardless of how the form splits it into two fields — this
// mirrors that cap client-side so entries never silently vanish on submit.
const MAX_MEDS_TOTAL = 8;

// "Checking" is deliberately one drug at a time, not a tag list like the
// other fields — it represents a single question ("does THIS interact with
// what I'm already on?"), and letting it hold several names blurred that
// distinction. Once one is set, the input hides in favor of the single
// chip; removing that chip is the only way back to typing a new one.
function checkingFieldHtml(items) {
  const hasDrug = items.length > 0;
  return `
    <div>
      <label class="field-label block mb-2" style="color: var(--ink-soft);">The drug or prescription you want checked</label>
      <div id="checking-chips">
        ${hasDrug ? `
          <div class="flex flex-wrap gap-2">
            <button type="button" data-remove="0" title="Remove ${esc(items[0])}" aria-label="Remove ${esc(items[0])}" class="chip chip-remove inline-flex items-center gap-1.5 text-[12.5px] font-medium pl-3 pr-2.5 py-1 rounded-full">${esc(items[0])}<span class="text-[15px] leading-none" aria-hidden="true">×</span></button>
          </div>
          <p class="text-[11px] mt-1.5" style="color: var(--ink-faint);">One at a time — remove this to check a different drug instead.</p>
        ` : `
          <div class="flex gap-2">
            <input id="checking-input" type="text" autocomplete="off" placeholder="e.g. the new prescription you just got" class="field flex-1 border rounded-lg px-3.5 py-2.5 text-[13.5px]" style="border-color: var(--line);" />
            <button id="checking-add" type="button" class="px-4 rounded-lg border text-[13px] font-semibold" style="border-color: var(--line); color: var(--primary);">Add</button>
          </div>
        `}
      </div>
    </div>
  `;
}

function wireCheckingField(rerender) {
  const input = $('#checking-input');
  if (input) {
    const commit = () => {
      const v = input.value.trim();
      if (v && _draft.checking.length === 0) { _draft.checking = [v]; rerender(); }
    };
    $('#checking-add').addEventListener('click', commit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); commit(); }
    });
  } else {
    // The chip (not the input) is what's rendered once a drug is set — its
    // container is recreated fresh on every rerenderChecking() call, same
    // as tagInputHtml's own -chips divs, so this listener never stacks.
    $('#checking-chips').addEventListener('click', (e) => {
      if (!e.target.closest('[data-remove]')) return;
      _draft.checking = [];
      rerender();
    });
  }
}

function wireTagInput(id, list, rerender, canAdd = () => list.length < MAX_MEDS_TOTAL) {
  const input = $(`#${id}-input`);
  const addBtn = $(`#${id}-add`);
  const commit = () => {
    const v = input.value.trim();
    if (v && canAdd()) { list.push(v); input.value = ''; rerender(); }
  };
  addBtn.addEventListener('click', commit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); commit(); }
  });
  $(`#${id}-chips`).addEventListener('click', (e) => {
    const btn = e.target.closest('[data-remove]');
    if (!btn) return;
    list.splice(Number(btn.dataset.remove), 1);
    rerender();
  });
}

function renderChecker() {
  shell('check', `
    <div class="reveal">
      <p class="label-tag mb-4" style="color: var(--accent);">Quick check · no account needed</p>
      <h1 class="font-display text-heading-sm mb-4" style="color: var(--ink);">What are you checking?</h1>
      <p class="text-prose mb-10" style="color: var(--ink-soft); max-width: 34rem;">
        Tell us the drug or prescription you want checked, and what else you're already
        taking. Nothing here is sent to a care team or saved to an account — it stays in
        this browser tab, and disappears when you leave.
      </p>

      <form id="checker-form" class="card card-shadow rounded-2xl p-6 sm:p-8 space-y-7">
        <div id="checking-field"></div>
        <div id="current-field"></div>
        <div id="allergy-field"></div>
        <div>
          <label class="label-tag block mb-2" style="color: var(--ink);">Anything else about your history you'd like to mention? <span class="normal-case" style="color: var(--ink-faint); font-weight: 400; letter-spacing: normal;">(optional)</span></label>
          <textarea id="notes-input" rows="3" maxlength="600" placeholder="Past reactions, other conditions, how you're feeling — anything that might matter here. This isn't saved anywhere; it's just used to help explain your results." class="field w-full border rounded-lg px-3.5 py-2.5 text-[13.5px]" style="border-color: var(--line);"></textarea>
        </div>

        <div id="checker-error" class="hidden text-[13px] font-medium" style="color: var(--critical);"></div>

        <div class="flex items-center justify-between pt-1">
          <p class="text-[11.5px] max-w-xs leading-relaxed" style="color: var(--ink-faint);">Not reviewed by a pharmacist. Not a substitute for professional medical advice.</p>
          <button id="checker-submit" type="submit" class="label-tag text-white px-6 py-3.5 rounded-full whitespace-nowrap" style="background: var(--primary);">Check now →</button>
        </div>
      </form>
    </div>
  `);

  const totalMedsCanAdd = () => _draft.checking.length + _draft.current.length < MAX_MEDS_TOTAL;
  function rerenderChecking() { $('#checking-field').innerHTML = checkingFieldHtml(_draft.checking); wireCheckingField(rerenderChecking); }
  function rerenderCurrent() { $('#current-field').innerHTML = tagInputHtml('current', "What else are you currently taking? — your history", 'e.g. warfarin', _draft.current); wireTagInput('current', _draft.current, rerenderCurrent, totalMedsCanAdd); }
  function rerenderAllergies() { $('#allergy-field').innerHTML = tagInputHtml('allergy', 'Any known allergies or past bad reactions?', 'e.g. penicillin', _draft.allergies); wireTagInput('allergy', _draft.allergies, rerenderAllergies); }
  rerenderChecking();
  rerenderCurrent();
  rerenderAllergies();
  $('#notes-input').value = _draft.notes;
  $('#notes-input').addEventListener('input', (e) => { _draft.notes = e.target.value; });

  $('#checker-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    // Commit any text still sitting in the tag inputs that the user didn't press Enter/Add on.
    // #checking-input only exists when no drug is set yet (see checkingFieldHtml) — once one
    // is added the field shows a chip instead, so there's never leftover text to lose there.
    const checkingLeft = $('#checking-input')?.value.trim();
    if (checkingLeft && _draft.checking.length === 0) _draft.checking = [checkingLeft];
    const currentLeft = $('#current-input').value.trim();
    if (currentLeft && _draft.checking.length + _draft.current.length < MAX_MEDS_TOTAL) _draft.current.push(currentLeft);
    const allergyLeft = $('#allergy-input').value.trim();
    if (allergyLeft && _draft.allergies.length < MAX_MEDS_TOTAL) _draft.allergies.push(allergyLeft);

    const errorEl = $('#checker-error');
    if (!_draft.checking.length && !_draft.current.length) {
      errorEl.textContent = 'Add at least one drug to check.';
      errorEl.classList.remove('hidden');
      return;
    }
    errorEl.classList.add('hidden');
    runCheck();
  });
}

async function runCheck() {
  shell('check', `
    <div class="reveal max-w-lg mx-auto text-center py-16">
      <div class="scan-track card card-shadow rounded-2xl p-10 mb-6">
        <div class="scan-bar"></div>
        <p class="font-display text-[22px] mb-2" style="color: var(--primary);">Reading the evidence</p>
        <p id="scan-status" class="text-[13px]" style="color: var(--ink-soft);">Resolving medication identities…</p>
      </div>
      <p class="text-[12px]" style="color: var(--ink-faint);">This runs the same deterministic rule engine your pharmacist's console uses.</p>
    </div>
  `);
  const phrases = ['Resolving medication identities…', 'Cross-referencing known interactions…', 'Checking allergy conflicts…', 'Compiling your report…'];
  let i = 0;
  const statusTimer = setInterval(() => {
    i = (i + 1) % phrases.length;
    const el = $('#scan-status');
    if (el) el.textContent = phrases[i];
  }, 1100);

  // "checking" drugs first, then "current" — resolved_medications comes
  // back in the same order, so renderResults() can slice it by count to
  // label which chip is which without any backend change.
  const medications = [..._draft.checking, ..._draft.current];
  try {
    const data = await api('/api/self-check', {
      method: 'POST',
      body: JSON.stringify({ medications, allergies: _draft.allergies }),
    });
    clearInterval(statusTimer);
    renderResults(data, _draft.checking.length);
  } catch (err) {
    clearInterval(statusTimer);
    renderChecker();
    setTimeout(() => {
      const errorEl = $('#checker-error');
      if (errorEl) { errorEl.textContent = err.message; errorEl.classList.remove('hidden'); }
    }, 0);
  }
}

// ── Results ───────────────────────────────────────────────────────────────────

const SEVERITY_META = {
  critical:      { label: 'Critical',              color: 'var(--critical)',      bg: 'rgba(255,92,92,0.14)' },
  major:         { label: 'Major',                 color: 'var(--major)',         bg: 'rgba(255,138,61,0.14)' },
  caution:       { label: 'Caution',                color: 'var(--caution)',       bg: 'rgba(255,184,41,0.14)' },
  informational: { label: 'Informational',          color: 'var(--informational)', bg: 'rgba(111,200,255,0.14)' },
  unknown:       { label: 'Not yet clinically reviewed', color: 'var(--unknown)',  bg: 'rgba(184,146,255,0.14)' },
};

const SEVERITY_RANK = { critical: 4, major: 3, unknown: 2, caution: 1, informational: 0 };
// How urgently a finding deserves attention — takes the higher of its
// confirmed severity and its (unreviewed) reported_severity, so a
// well-documented-but-unapproved MAJOR interaction still sorts and reads
// as important instead of blending in with a truly informational one.
const findingUrgency = (f) => Math.max(SEVERITY_RANK[f.severity] ?? 0, SEVERITY_RANK[f.reported_severity] ?? 0);

function findingTitle(f) {
  const factors = f.patient_factors || {};
  if (f.type === 'allergy') return `Matches a known allergy — ${factors.ingredient || ''}`;
  if (f.type === 'duplicate') return `Duplicate ingredient — ${factors.ingredient || ''} appears ${factors.occurrence_count || 2}×`;
  if (f.type === 'ddi') return `Interaction: ${factors.ingredient_a || '?'} + ${factors.ingredient_b || '?'}`;
  if (f.type === 'unknown') return `Unreviewed pairing: ${factors.ingredient_a || '?'} + ${factors.ingredient_b || '?'}`;
  return 'Finding';
}

function overallBanner(overallSeverity, seeADoctor, hasUnresolvedMed) {
  if (seeADoctor) {
    return `
      <div class="card card-shadow rounded-2xl p-6 flex items-start gap-4" style="border-left: 4px solid var(--critical); background: rgba(255,92,92,0.08);">
        <div class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background: rgba(255,92,92,0.16);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3.5 L22 20.5 L2 20.5 Z" stroke="var(--critical)" stroke-width="2" stroke-linejoin="round"/><path d="M12 9.5 V14.5" stroke="var(--critical)" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.1" fill="var(--critical)"/></svg>
        </div>
        <div>
          <p class="font-display text-[19px] font-semibold mb-1" style="color: var(--critical);">Please talk to a doctor or pharmacist before taking these together</p>
          <p class="text-[13px] leading-relaxed" style="color: var(--ink-soft);">Something below looks serious enough to check first — see which finding triggered this and why in the details below.</p>
        </div>
      </div>`;
  }
  // Never show the reassuring "nothing flagged" message when we're not
  // confident we understood every name typed in — a patient typing two
  // drugs into one field (e.g. "Bactrim, warfarin") can end up with one
  // name silently dropped during matching, and a green checkmark in that
  // case is a false, dangerous reassurance, not an honest "no findings".
  if (!overallSeverity && hasUnresolvedMed) {
    return `
      <div class="card card-shadow rounded-2xl p-6 flex items-start gap-4" style="border-left: 4px solid var(--caution);">
        <div class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background: rgba(255,184,41,0.16);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3.5 L22 20.5 L2 20.5 Z" stroke="var(--caution)" stroke-width="2" stroke-linejoin="round"/><path d="M12 9.5 V14.5" stroke="var(--caution)" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.1" fill="var(--caution)"/></svg>
        </div>
        <div>
          <p class="font-display text-[19px] font-semibold mb-1">We're not sure we understood everything you entered</p>
          <p class="text-[13px] leading-relaxed" style="color: var(--ink-soft);">One or more items below (marked <strong>·approx</strong>) didn't match a known medication exactly — if you typed more than one drug into the same box, try adding them as separate entries instead. No findings below isn't a clean bill of health until every item is confirmed.</p>
        </div>
      </div>`;
  }
  if (!overallSeverity) {
    return `
      <div class="card card-shadow rounded-2xl p-6 flex items-start gap-4" style="border-left: 4px solid var(--safe);">
        <div class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background: rgba(62,207,142,0.16);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12.5 L9.5 17 L19 7" stroke="var(--safe)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <p class="font-display text-[19px] font-semibold mb-1">Nothing flagged in our data</p>
          <p class="text-[13px] leading-relaxed" style="color: var(--ink-soft);">No duplicate ingredients, recorded allergy conflicts, or known interaction rules matched what you entered. That's reassuring, but it isn't a guarantee — it only reflects what's in this dataset, and no pharmacist has reviewed it.</p>
        </div>
      </div>`;
  }
  const meta = SEVERITY_META[overallSeverity] || SEVERITY_META.unknown;
  return `
    <div class="card card-shadow rounded-2xl p-6 flex items-start gap-4" style="border-left: 4px solid ${meta.color};">
      <div class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background: ${meta.bg};">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3.5 L22 20.5 L2 20.5 Z" stroke="${meta.color}" stroke-width="2" stroke-linejoin="round"/><path d="M12 9.5 V14.5" stroke="${meta.color}" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.1" fill="${meta.color}"/></svg>
      </div>
      <div>
        <p class="font-display text-[19px] font-semibold mb-1">We found something to review — highest priority: <span style="color: ${meta.color};">${meta.label}</span></p>
        <p class="text-[13px] leading-relaxed" style="color: var(--ink-soft);">See the findings below. None of this has been confirmed by a pharmacist — treat anything above "Informational" as worth a real conversation with one, especially "Critical" or "Major".</p>
      </div>
    </div>`;
}

function medChipsHtml(meds, offset) {
  return meds.map((m, i) => `
    <button data-drug-info="${offset + i}" class="chip inline-flex items-center gap-1.5 text-[12.5px] font-medium pl-3 pr-3 py-1.5 rounded-full">
      ${esc(m.input)}
      ${!m.identity_confirmed ? `<span title="Matched approximately — for best results use the name printed on the label" style="color: var(--accent);">·approx</span>` : ''}
    </button>
  `).join('');
}

function renderResults(data, checkingCount) {
  const { resolved_medications = [], findings: rawFindings = [], overall_severity, see_a_doctor } = data;
  const checkingMeds = resolved_medications.slice(0, checkingCount);
  const currentMeds = resolved_medications.slice(checkingCount);
  const inputsSnapshot = {
    medications: [..._draft.checking, ..._draft.current],
    allergies: [..._draft.allergies], notes: _draft.notes,
  };
  // Most urgent first — the on-demand explanations auto-fetch in this
  // order too, so the thing most worth reading loads first.
  const findings = [...rawFindings].sort((a, b) => findingUrgency(b) - findingUrgency(a));
  const hasUnresolvedMed = resolved_medications.some(m => !m.identity_confirmed);

  shell('check', `
    <div class="reveal space-y-6">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <p class="label-tag" style="color: var(--accent);">Your results</p>
        <div class="flex items-center gap-4">
          <button id="check-another" class="text-[12.5px] font-semibold px-3.5 py-1.5 rounded-full border" style="border-color: var(--primary); color: var(--primary);">Check a different drug →</button>
          <button id="new-check" class="text-[12.5px] font-semibold underline underline-link" style="color: var(--ink-soft);">Start a new check</button>
        </div>
      </div>

      ${overallBanner(overall_severity, see_a_doctor, hasUnresolvedMed)}

      ${checkingMeds.length ? `
      <div>
        <p class="text-[12px] font-semibold uppercase tracking-wide mb-2.5" style="color: var(--ink-faint);">You're checking</p>
        <div class="flex flex-wrap gap-2">${medChipsHtml(checkingMeds, 0)}</div>
      </div>` : ''}

      ${currentMeds.length ? `
      <div>
        <p class="text-[12px] font-semibold uppercase tracking-wide mb-2.5" style="color: var(--ink-faint);">Against what you're already taking</p>
        <div class="flex flex-wrap gap-2">${medChipsHtml(currentMeds, checkingCount)}</div>
      </div>` : ''}
      <div id="drug-info-panel"></div>

      <div>
        <p class="text-[12px] font-semibold uppercase tracking-wide mb-2.5" style="color: var(--ink-faint);">Findings ${findings.length ? `(${findings.length})` : ''}</p>
        <div id="findings-list" class="space-y-3">
          ${findings.length ? findings.slice(0, DEFAULT_VISIBLE_FINDINGS).map(findingCard).join('') : `
            <div class="card rounded-2xl p-6 text-center" style="border-style: dashed;">
              <p class="text-[13px]" style="color: var(--ink-soft);">No findings to show.</p>
            </div>`}
        </div>
        ${findings.length > DEFAULT_VISIBLE_FINDINGS ? `
          <button id="show-more-findings" class="w-full mt-3 text-[13px] font-semibold py-2.5 rounded-xl border" style="border-color: var(--line); color: var(--primary); background: var(--paper-raised);">
            Show ${findings.length - DEFAULT_VISIBLE_FINDINGS} more finding${findings.length - DEFAULT_VISIBLE_FINDINGS > 1 ? 's' : ''} →
          </button>` : ''}
      </div>
    </div>
  `);

  $('#new-check').addEventListener('click', () => { _draft.checking = []; _draft.current = []; _draft.allergies = []; _draft.notes = ''; renderChecker(); });
  // Keeps current medications/allergies/notes intact — only clears the
  // single "checking" slot — so checking a second, third, etc. drug
  // against the same baseline doesn't mean re-typing all of it again.
  $('#check-another').addEventListener('click', () => { _draft.checking = []; renderChecker(); });

  $$('[data-drug-info]').forEach(btn => {
    btn.addEventListener('click', () => toggleDrugInfo(btn, resolved_medications[Number(btn.dataset.drugInfo)]));
  });

  $$('[data-explain]').forEach(btn => {
    btn.addEventListener('click', () => runExplain(btn, Number(btn.dataset.explain), inputsSnapshot));
  });

  // Auto-fetch the plain-language explanation for whatever's actually
  // visible on load — the top DEFAULT_VISIBLE_FINDINGS, already sorted
  // most-urgent-first — so the real "here's what this means" answer is
  // there the instant a patient sees the finding, not gated behind a
  // click. Findings beyond that stay collapsed behind "Show more" and
  // only get fetched once the patient actually asks to see them, so a
  // large multi-drug check with many real matches can't burst Groq's rate
  // limit for cards nobody has looked at yet.
  findings.slice(0, DEFAULT_VISIBLE_FINDINGS).forEach(f => {
    const slot = document.querySelector(`[data-explain-slot="${f.index}"]`);
    if (slot) runExplain(slot, f.index, inputsSnapshot);
  });

  const showMoreBtn = $('#show-more-findings');
  if (showMoreBtn) {
    showMoreBtn.addEventListener('click', () => {
      const hidden = findings.slice(DEFAULT_VISIBLE_FINDINGS);
      $('#findings-list').insertAdjacentHTML('beforeend', hidden.map(findingCard).join(''));
      showMoreBtn.remove();
      hidden.forEach(f => {
        const slot = document.querySelector(`[data-explain-slot="${f.index}"]`);
        if (slot) runExplain(slot, f.index, inputsSnapshot);
      });
    });
  }
}

const DEFAULT_VISIBLE_FINDINGS = 3;

function findingCard(f) {
  const meta = SEVERITY_META[f.severity] || SEVERITY_META.unknown;
  // reported_severity "unknown" here means the source dataset itself has no
  // severity rating for this pairing — a different thing from our own
  // governance status (which is also, confusingly, called "unknown"). Only
  // show the hint when there's an actual rating to report.
  const hasRealReportedSeverity = f.reported_severity && f.reported_severity !== 'unknown';
  const reportedMeta = hasRealReportedSeverity ? SEVERITY_META[f.reported_severity] : null;
  const reportedHint = (f.type === 'unknown' && reportedMeta) ? `
    <p class="text-[11.5px] font-semibold mb-3" style="color: ${reportedMeta.color};">Our data suggests: ${reportedMeta.label} (not yet confirmed by a pharmacist)</p>
  ` : (f.type === 'unknown' ? `
    <p class="text-[11.5px] mb-3" style="color: var(--ink-faint);">No severity rating available in our data for this pairing.</p>
  ` : '');
  const doctorCallout = f.see_a_doctor ? `
    <div class="flex items-center gap-2 text-[12.5px] font-bold px-3 py-2 rounded-lg mb-3" style="background: rgba(255,92,92,0.14); color: var(--critical);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><path d="M12 3.5 L22 20.5 L2 20.5 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9.5 V14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.1" fill="currentColor"/></svg>
      See a doctor or pharmacist before taking these together
    </div>` : '';
  return `
    <div class="card card-shadow rounded-2xl p-5" style="border-left: 3px solid ${meta.color};">
      <div class="flex items-start justify-between gap-3 mb-2">
        <p class="text-[14px] font-semibold leading-snug">${esc(findingTitle(f))}</p>
        <span class="inline-flex items-center gap-1.5 text-[10.5px] font-bold uppercase tracking-wide px-2.5 py-1 rounded-full whitespace-nowrap" style="background: ${meta.bg}; color: ${meta.color};">${meta.label}</span>
      </div>
      ${reportedHint}
      <p class="text-[13px] leading-relaxed mb-3" style="color: var(--ink-soft);">${esc(f.clinical_effect || '')}</p>
      ${doctorCallout}
      <p class="text-[12px] mb-3" style="color: var(--ink-faint);">${esc(f.patient_guidance || f.recommended_action || '')}</p>
      <div data-explain-slot="${f.index}">
        <div class="flex items-center gap-2 text-[12.5px]" style="color: var(--ink-soft);"><span class="spinner w-3.5 h-3.5"></span>Working out what this means for you…</div>
      </div>
    </div>
  `;
}

async function runExplain(btn, findingIndex, inputs) {
  const slot = btn.closest('[data-explain-slot]') || document.querySelector(`[data-explain-slot="${findingIndex}"]`);
  try {
    const data = await api('/api/explain', {
      method: 'POST',
      body: JSON.stringify({
        medications: inputs.medications, allergies: inputs.allergies,
        finding_index: findingIndex, patient_notes: inputs.notes,
      }),
    });
    const sources = data.citations && data.citations.length
      ? `<details class="mt-2"><summary class="text-[11.5px] font-semibold cursor-pointer" style="color: var(--ink-faint);">Show ${data.citations.length} source${data.citations.length>1?'s':''}</summary>
          <div class="mt-2 space-y-2">${data.citations.map(c => `<div class="text-[11.5px] leading-relaxed p-2.5 rounded-lg" style="background: var(--paper); color: var(--ink-soft);"><span class="font-semibold">${esc(c.generic_name||'')} — ${esc((c.section||'').replace(/_/g,' '))}:</span> ${esc((c.text||'').slice(0,280))}${(c.text||'').length>280?'…':''}</div>`).join('')}</div>
        </details>`
      : '';
    slot.innerHTML = `
      <div class="fade-in pt-2 border-t" style="border-color: var(--line-soft);">
        <div class="text-[13px] leading-relaxed mt-3" style="color: var(--ink);">${mdLite(data.explanation)}</div>
        ${sources}
      </div>
    `;
  } catch (err) {
    slot.innerHTML = `
      <p class="text-[12.5px] mb-2" style="color: var(--critical);">Couldn't load an explanation: ${esc(err.message)}</p>
      <button data-explain="${findingIndex}" class="text-[12.5px] font-semibold px-3.5 py-1.5 rounded-full border" style="border-color: var(--line); color: var(--primary);">Try again →</button>
    `;
    const retryBtn = slot.querySelector('[data-explain]');
    if (retryBtn) retryBtn.addEventListener('click', () => runExplain(retryBtn, findingIndex, inputs));
  }
}

async function toggleDrugInfo(btn, resolvedMed) {
  const panel = $('#drug-info-panel');
  if (panel.dataset.open === resolvedMed.input) { panel.innerHTML = ''; panel.dataset.open = ''; return; }
  panel.dataset.open = resolvedMed.input;
  panel.innerHTML = `<div class="flex items-center gap-2 text-[12.5px] card rounded-xl p-4" style="color: var(--ink-soft);"><span class="spinner w-3.5 h-3.5"></span>Looking up ${esc(resolvedMed.input)}…</div>`;
  try {
    const data = await api('/api/query', { method: 'POST', body: JSON.stringify({ prescription: resolvedMed.input, top_k: 3 }) });
    // An empty detected_drugs means the typed name wasn't recognized against
    // our indexed FDA label data — answer_ddi() falls back to an unfiltered
    // search in that case, which can surface text about unrelated drugs.
    // Say so plainly rather than show a summary that looks like it's about
    // this medication when it isn't.
    if (!data.detected_drugs || !data.detected_drugs.length) {
      panel.innerHTML = `
        <div class="fade-in card rounded-xl p-4" style="border-style: dashed;">
          <p class="text-[13px] leading-relaxed" style="color: var(--ink-soft);">We don't have FDA label data indexed for "${esc(resolvedMed.input)}" under that exact name yet. Try the generic ingredient name printed on the label.</p>
        </div>
      `;
      return;
    }
    const first = (data.results || [])[0];
    panel.innerHTML = `
      <div class="fade-in card card-shadow rounded-xl p-4">
        <p class="text-[12px] font-semibold uppercase tracking-wide mb-2" style="color: var(--ink-faint);">FDA label summary — ${esc(resolvedMed.input)}</p>
        <div class="text-[13px] leading-relaxed" style="color: var(--ink);">${mdLite((first && first.answer) || 'No information found.')}</div>
      </div>
    `;
  } catch (err) {
    panel.innerHTML = `<p class="text-[12.5px]" style="color: var(--critical);">${esc(err.message)}</p>`;
  }
}

// ── Auth (sign in / create account) — existing flow, reskinned ───────────────

function renderAuth() {
  shell('auth', `
    <div class="reveal max-w-sm mx-auto">
      <p class="label-tag mb-3" style="color: var(--accent);">Care team account</p>
      <h1 class="font-display text-subheading mb-6" style="color: var(--ink);">Welcome back</h1>
      <div class="flex gap-1 p-1 rounded-full mb-7 text-[13px] font-medium" style="background: var(--line-soft);">
        <button id="tab-login" class="flex-1 py-2 rounded-full transition-colors">Sign in</button>
        <button id="tab-register" class="flex-1 py-2 rounded-full transition-colors">Create account</button>
      </div>
      <div id="auth-forms"></div>
      <p id="auth-error" class="text-sm mt-4 hidden" style="color: var(--critical);"></p>
      <p class="text-[12px] mt-8 text-center" style="color: var(--ink-faint);">Don't have prescriptions on file yet? <button id="skip-to-check" class="underline underline-link font-semibold" style="color: var(--primary);">Try the quick check instead</button></p>
    </div>
  `);
  $('#skip-to-check').addEventListener('click', renderChecker);

  const forms = $('#auth-forms');
  const errorEl = $('#auth-error');
  const showError = (msg) => { errorEl.textContent = msg; errorEl.classList.remove('hidden'); };
  const clearError = () => errorEl.classList.add('hidden');

  function renderLogin() {
    clearError();
    forms.innerHTML = `
      <form id="login-form" class="space-y-4">
        <div>
          <label class="field-label block mb-1.5" style="color: var(--ink-soft);">Email</label>
          <input type="email" name="email" required class="field w-full border rounded-lg px-3.5 py-2.5 text-sm" style="border-color: var(--line);" placeholder="you@example.com" />
        </div>
        <div>
          <label class="field-label block mb-1.5" style="color: var(--ink-soft);">Password</label>
          <input type="password" name="password" required class="field w-full border rounded-lg px-3.5 py-2.5 text-sm" style="border-color: var(--line);" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-primary label-tag w-full text-white py-3 rounded-full mt-2">Sign in</button>
      </form>
    `;
    $('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Signing in…';
      const fd = new FormData(e.target);
      try {
        const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }) });
        setToken(data.access_token);
        setUser(data.user);
        renderDashboard();
      } catch (err) {
        showError(err.message);
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });
  }

  async function renderRegister() {
    clearError();
    forms.innerHTML = `<p class="text-caption" style="color: var(--ink-faint);">Loading care organizations…</p>`;
    let orgs = [];
    try {
      const data = await api('/v1/organizations');
      orgs = data.organizations || [];
    } catch { /* fall through with empty list */ }

    const orgOptions = orgs.length
      ? orgs.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join('')
      : `<option value="">No organizations available yet</option>`;

    forms.innerHTML = `
      <form id="register-form" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="field-label block mb-1.5" style="color: var(--ink-soft);">First name</label>
            <input type="text" name="first_name" required class="field w-full border rounded-lg px-3.5 py-2.5 text-sm" style="border-color: var(--line);" />
          </div>
          <div>
            <label class="field-label block mb-1.5" style="color: var(--ink-soft);">Last name</label>
            <input type="text" name="last_name" required class="field w-full border rounded-lg px-3.5 py-2.5 text-sm" style="border-color: var(--line);" />
          </div>
        </div>
        <div>
          <label class="field-label block mb-1.5" style="color: var(--ink-soft);">Care organization</label>
          <select name="organization_id" required class="field w-full border rounded-lg px-3.5 py-2.5 text-sm" style="border-color: var(--line);">${orgOptions}</select>
        </div>
        <div>
          <label class="field-label block mb-1.5" style="color: var(--ink-soft);">Email</label>
          <input type="email" name="email" required class="field w-full border rounded-lg px-3.5 py-2.5 text-sm" style="border-color: var(--line);" placeholder="you@example.com" />
        </div>
        <div>
          <label class="field-label block mb-1.5" style="color: var(--ink-soft);">Password</label>
          <input type="password" name="password" required minlength="8" class="field w-full border rounded-lg px-3.5 py-2.5 text-sm" style="border-color: var(--line);" placeholder="At least 8 characters" />
        </div>
        <button type="submit" class="btn-primary label-tag w-full text-white py-3 rounded-full mt-2">Create account</button>
      </form>
    `;
    $('#register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Creating account…';
      const fd = new FormData(e.target);
      try {
        await api('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            email: fd.get('email'), password: fd.get('password'),
            first_name: fd.get('first_name'), last_name: fd.get('last_name'),
            full_name: `${fd.get('first_name')} ${fd.get('last_name')}`,
            organization_id: fd.get('organization_id'),
          }),
        });
        const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }) });
        setToken(data.access_token);
        setUser(data.user);
        renderDashboard();
      } catch (err) {
        showError(err.message);
        btn.disabled = false; btn.textContent = 'Create account';
      }
    });
  }

  function setTab(active) {
    const login = $('#tab-login'), register = $('#tab-register');
    login.style.background = active === 'login' ? 'var(--paper-raised)' : 'transparent';
    login.style.color = active === 'login' ? 'var(--ink)' : 'var(--ink-soft)';
    register.style.background = active === 'register' ? 'var(--paper-raised)' : 'transparent';
    register.style.color = active === 'register' ? 'var(--ink)' : 'var(--ink-soft)';
  }

  $('#tab-login').addEventListener('click', () => { setTab('login'); renderLogin(); });
  $('#tab-register').addEventListener('click', () => { setTab('register'); renderRegister(); });
  setTab('login'); renderLogin();
}

// ── Signed-in dashboard — existing prescriber-issued cases ────────────────────

// bg/fg/dot are now inline-style values (rgba tints + CSS vars), not
// Tailwind utility classes — the old bg-slate-100/bg-blue-50/etc. classes
// were light backgrounds with dark text, designed for the old paper
// theme; on a black void canvas they'd render as light rectangles rather
// than tinted pills consistent with the rest of this redesign.
const STATE_META = {
  draft:                        { label: 'Getting started',        bg: 'rgba(154,154,154,0.14)', fg: 'var(--ink-soft)', dot: 'var(--ink-soft)' },
  awaiting_analysis:             { label: 'Reviewing your prescription', bg: 'rgba(154,154,154,0.14)', fg: 'var(--ink-soft)', dot: 'var(--ink-soft)' },
  awaiting_pharmacist_review:    { label: 'Your pharmacist is reviewing this', bg: 'rgba(111,200,255,0.14)', fg: 'var(--informational)', dot: 'var(--informational)' },
  awaiting_prescriber_response:  { label: 'Checking with your prescriber', bg: 'rgba(255,184,41,0.14)', fg: 'var(--caution)', dot: 'var(--caution)' },
  escalated:                     { label: 'Under urgent review',    bg: 'rgba(255,92,92,0.14)', fg: 'var(--critical)', dot: 'var(--critical)' },
  ready_to_dispense:             { label: 'Reviewed and ready',     bg: 'rgba(62,207,142,0.14)', fg: 'var(--safe)', dot: 'var(--safe)' },
  held_or_cancelled:             { label: 'On hold — contact your pharmacy', bg: 'rgba(255,92,92,0.14)', fg: 'var(--critical)', dot: 'var(--critical)' },
  closed:                        { label: 'Complete',               bg: 'rgba(62,207,142,0.14)', fg: 'var(--safe)', dot: 'var(--safe)' },
};

function caseCard(c, i) {
  const meta = STATE_META[c.state] || STATE_META.draft;
  const comm = (c.communications && c.communications[0]) || null;
  const body = comm
    ? comm.explanation
    : `We're working through your ${esc(c.medication)} prescription. This isn't a guarantee of safety or risk — it means your pharmacist hasn't finished reviewing it yet.`;
  const dateStr = c.created_at ? new Date(c.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';

  return `
    <div class="card card-shadow rounded-2xl p-5 reveal" style="animation-delay: ${i * 70}ms">
      <div class="flex items-start justify-between gap-3 mb-3">
        <div>
          <p class="field-label mb-1" style="color: var(--ink-faint);">${dateStr}</p>
          <h3 class="font-display text-heading-xs">${esc(c.medication)}</h3>
        </div>
        <span class="field-label inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full whitespace-nowrap" style="background: ${meta.bg}; color: ${meta.fg};">
          <span class="w-1.5 h-1.5 rounded-full" style="background: ${meta.dot};"></span>${meta.label}
        </span>
      </div>
      ${c.has_findings ? (c.interaction_review === 'pending' ? `
        <div class="flex items-center gap-1.5 mb-2.5 field-label" style="color: var(--critical)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink:0">
            <path d="M12 3.5 L22 20.5 L2 20.5 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M12 9.5 V14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="17.3" r="1.1" fill="currentColor"/>
          </svg>
          Pending clinical review — your pharmacist flagged something not yet fully reviewed
        </div>
      ` : `
        <div class="flex items-center gap-1.5 mb-2.5 field-label" style="color: var(--safe)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink:0">
            <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="2"/>
            <path d="M7.5 12.5 L10.5 15.5 L16.5 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Reviewed — your pharmacist has confirmed this
        </div>
      `) : ''}
      <p class="text-[13.5px] leading-relaxed" style="color: var(--ink-soft);">${esc(body)}</p>
    </div>
  `;
}

async function renderDashboard() {
  if (!token()) { renderAuth(); return; }
  const user = getUser();
  shell('dashboard', `
    <div class="reveal">
      <p class="label-tag mb-2" style="color: var(--accent);">Your care team</p>
      <h1 class="font-display text-subheading mb-1" style="color: var(--ink);">Hi, ${esc((user && user.full_name) || 'there')}</h1>
      <p class="text-caption mb-6" style="color: var(--ink-soft);">Your prescriptions, and where each one stands with your care team.</p>
      <div id="cases" class="space-y-3"></div>
    </div>
  `);

  const casesEl = $('#cases');
  casesEl.innerHTML = `<p class="text-caption" style="color: var(--ink-faint);">Loading…</p>`;
  try {
    const data = await api('/v1/my/cases');
    const cases = data.cases || [];
    casesEl.innerHTML = cases.length
      ? cases.map(caseCard).join('')
      : `<div class="card rounded-2xl p-8 text-center reveal" style="border-style: dashed;">
           <p class="text-sm font-semibold">No prescriptions on file yet</p>
           <p class="text-caption mt-1.5 max-w-xs mx-auto" style="color: var(--ink-faint);">Once your prescriber sends a prescription to your pharmacy, it'll show up here after review. In the meantime, try the quick check.</p>
         </div>`;
  } catch (err) {
    if (err.message.includes('401') || err.message.toLowerCase().includes('token')) {
      setToken(null); setUser(null); renderAuth(); return;
    }
    casesEl.innerHTML = `<p class="text-sm" style="color: var(--critical);">${esc(err.message)}</p>`;
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────

(token() ? renderDashboard() : renderHome());
</script>
</body>
